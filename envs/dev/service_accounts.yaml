# Service accounts: EVERY identity of the environment and EVERYTHING it can access.
# Read this file to answer "who can do what". Apps only use these identities; they never create one.
#
# type: workload  Google service account sa-<name> + Kubernetes service account sa-<name> in
#                 <namespace>, linked by Workload Identity (pods running as the KSA act as the GSA)
# type: github    Google service account sa-<name>, usable only by GitHub Actions of <repo>
#
# access: "<component type>/<name>: <role>"
#   firestore/<db>       reader | writer       (databases.yaml, scoped to that database)
#   cloudsql/<instance>  client                (databases.yaml, scoped to that instance)
#   secret/<name>        reader                (secrets.yaml)
#   topic/<name>         publisher | subscriber | viewer   (messages.yaml)
#   registry/<name>      reader | writer       (registries.yaml)
#   namespace/<name>     deployer              (kubernetes.yaml: deploy into that namespace only)
#   dns                  admin                 (Cloud DNS of the project, for ExternalDNS)
#   project              viewer | editor | owner   (platform identities only)

# ---------- Platform ----------

terraform-ci:
  type: github
  repo: registry-institution-iac
  access:
    project: owner                     # training default; a real setup uses a curated role list

# external-dns:                        # uncomment with a DNS domain (network.yaml) and its namespace
#   type: workload
#   namespace: external-dns
#   access:
#     dns: admin

# ---------- optin-backend ----------

optin-backend-ci:                      # GitHub Actions of fabianomathilde/optin-backend
  type: github
  repo: optin-backend
  access:
    registry/optin-backend: writer     # push images
    namespace/optin-backend: deployer  # kubectl apply in its namespace only

optin-backend:                         # the running app (pods use KSA sa-optin-backend)
  type: workload
  namespace: optin-backend
  access:
    firestore/default: writer
    secret/optin-backend-api-password: reader
    topic/optin-backend-events: publisher
