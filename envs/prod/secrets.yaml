# Secrets: Secret Manager secrets. Access is granted in service_accounts.yaml with "secret/<name>".
#   generate: true   Terraform creates a random 32-character value (stored in the state too)
#   generate: false  the secret is created empty; add the value by hand:
#                    gcloud secrets versions add <name> --data-file=-

optin-backend-api-password:
  generate: true                       # optin-backend's HTTP Basic password (spring.security.user.password)
